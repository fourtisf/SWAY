# Nginx site for Sway (TLS via certbot). /api and /ws go to the API, everything else to Next.js.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream sway_web { server 127.0.0.1:3000; keepalive 32; }
upstream sway_api { server 127.0.0.1:4000; keepalive 32; }

server {
  listen 80;
  server_name sway.fam www.sway.fam;
  return 301 https://sway.fam$request_uri;
}

server {
  listen 443 ssl http2;
  server_name sway.fam;

  ssl_certificate     /etc/letsencrypt/live/sway.fam/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sway.fam/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://sway_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # Post images: up to 4 × 5 MB per request (the API checks each file).
  location = /api/uploads {
    client_max_body_size 21m;
    proxy_pass http://sway_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location /ws {
    proxy_pass http://sway_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://sway_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
