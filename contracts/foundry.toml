[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
# Robinhood Chain is an Arbitrum Orbit chain (Cancun opcodes available since ArbOS 20).
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = false
fs_permissions = [
  { access = "read", path = "./test/vectors" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
